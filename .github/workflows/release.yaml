# Releases to Maven Central with maven-release-plugin, the same way as a local
# `./mvnw release:prepare release:perform`: bumps the version, commits, tags,
# pushes to master, then builds the tag and deploys it with
# central-publishing-maven-plugin.
#
# Required secrets (repository or "release" environment):
#   CENTRAL_USERNAME / CENTRAL_PASSWORD: Central Portal user token (https://central.sonatype.com/account)
#   GPG_PRIVATE_KEY: ASCII-armored private key (gpg --armor --export-secret-keys <id>)
#   GPG_PASSPHRASE: passphrase of that key
name: release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version to release, e.g. 4.10.1 (empty: current version without -SNAPSHOT)"
        required: false
        type: string
      developmentVersion:
        description: "Next development version, e.g. 4.11.0-SNAPSHOT (empty: next patch SNAPSHOT)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the release commits and tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "24"
          cache: maven
          server-id: central # matches publishingServerId of central-publishing-maven-plugin
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Configure git
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          # the pom's developerConnection is an SSH URL: let maven-release-plugin push and clone over HTTPS
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      - name: Release
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          args=()
          if [ -n "${RELEASE_VERSION}" ]; then args+=("-DreleaseVersion=${RELEASE_VERSION}"); fi
          if [ -n "${DEVELOPMENT_VERSION}" ]; then args+=("-DdevelopmentVersion=${DEVELOPMENT_VERSION}"); fi
          ./mvnw --batch-mode "${args[@]}" release:prepare release:perform
